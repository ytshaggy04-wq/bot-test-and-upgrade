<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHAGGY XMD - PAIR CODE</title>
    <!-- Google Fonts & Tailwind/Bootstrap Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Anime Theme & Background */
        body {
            background-color: #0b0f19 !important;
            background-image: radial-gradient(circle at 50% 30%, #1a1c29 0%, #0b0f19 70%);
            color: #f1f5f9;
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Glassmorphism & Anime Neon Card */
        .card, .container, .box, .panel {
            background: rgba(15, 23, 42, 0.75) !important;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(168, 85, 247, 0.3) !important;
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.2), inset 0 0 15px rgba(59, 130, 246, 0.1);
            border-radius: 20px !important;
            padding: 30px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            position: relative;
            z-index: 10;
        }

        /* Typography */
        hh1, h2, h3, .title {
            color: #ffffff;
            font-weight: 700;
            text-shadow: 0 0 10px rgba(168, 85, 247, 0.5);
            margin-bottom: 10px;
        }

        p, .subtitle {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 25px;
        }

        /* Buttons Styling */
        button, .btn {
            background: linear-gradient(135deg, #a855f7 0%, #3b82f6 100%) !important;
            border: none !important;
            color: #ffffff !important;
            font-weight: 600;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4);
            transition: all 0.3s ease-in-out;
            border-radius: 12px !important;
            padding: 12px 20px;
            width: 100%;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover, .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.6);
        }

        /* Inputs Styling */
        input, select {
            background: rgba(30, 41, 59, 0.8) !important;
            border: 1px solid rgba(168, 85, 247, 0.4) !important;
            color: #ffffff !important;
            border-radius: 10px !important;
            padding: 12px 15px;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 20px;
            font-size: 15px;
            outline: none;
            transition: all 0.3s;
        }

        input:focus {
            border-color: #3b82f6 !important;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.4) !important;
        }

        /* Code Display Box */
        #code, .pair-code, #result {
            background: rgba(2, 6, 23, 0.9);
            border: 1px dashed #a855f7;
            padding: 15px;
            border-radius: 10px;
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 2px;
            color: #38bdf8;
            margin-top: 15px;
            word-break: break-all;
        }

        /* Snowfall Animation Container */
        .snowflakes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .snowflake {
            color: #ffffff;
            font-size: 1em;
            font-family: Arial, sans-serif;
            text-shadow: 0 0 5px #a855f7, 0 0 10px #3b82f6;
            position: fixed;
            top: -10px;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(-10vh) translateX(0);
                opacity: 1;
            }
            100% {
                transform: translateY(105vh) translateX(20px);
                opacity: 0.3;
            }
        }

        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateY(-20px); }
            15% { opacity: 1; transform: translateY(0); }
            85% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-20px); }
        }
    </style>
</head>
<body>

    <!-- Snowfall HTML Layer -->
    <div class="snowflakes" aria-hidden="true">
        <div class="snowflake">❅</div>
        <div class="snowflake">❆</div>
        <div class="snowflake">❄</div>
        <div class="snowflake">❅</div>
        <div class="snowflake">❆</div>
        <div class="snowflake">❄</div>
        <div class="snowflake">❅</div>
        <div class="snowflake">❆</div>
        <div class="snowflake">❄</div>
    </div>

    <!-- Main Container Card -->
    <div class="card">
        <h2>⚡ SHAGGY XMD ⚡</h2>
        <p>Enter your WhatsApp number with country code to generate your Anime Pair Code.</p>
        
        <div class="input-group">
            <input type="text" id="phone" placeholder="e.g. 94768069800" autocomplete="off">
        </div>
        
        <button id="submit">Generate Pair Code</button>
        
        <div id="result" style="display: none;"></div>
    </div>

    <!-- Snowfall & Auto-Copy Script -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // 1. Snowfall Effect Generator
            const sfContainer = document.querySelector('.snowflakes');
            const flakeChars = ['❅', '❆', '❄', '✨'];
            
            for (let i = 0; i < 35; i++) {
                const span = document.createElement('div');
                span.className = 'snowflake';
                span.innerHTML = flakeChars[Math.floor(Math.random() * flakeChars.length)];
                span.style.left = Math.random() * 100 + 'vw';
                span.style.animationDuration = (Math.random() * 3 + 2) + 's';
                span.style.animationDelay = Math.random() * 5 + 's';
                span.style.fontSize = (Math.random() * 10 + 10) + 'px';
                sfContainer.appendChild(span);
            }

            // 2. Auto-Copy Pair Code when generated (Without touching core logic)
            const observer = new MutationObserver((mutations) => {
                mutations.forEach((mutation) => {
                    if (mutation.addedNodes.length) {
                        const codeDisplay = document.querySelector('#code, .pair-code, #result');
                        if (codeDisplay && codeDisplay.innerText && codeDisplay.innerText.length >= 4 && !codeDisplay.dataset.copied) {
                            const codeText = codeDisplay.innerText.trim();
                            navigator.clipboard.writeText(codeText).then(() => {
                                codeDisplay.dataset.copied = "true";
                                
                                const notice = document.createElement('div');
                                notice.innerText = "📋 Pair Code Copied Automatically! ✨";
                                notice.style.cssText = "position:fixed; top:20px; right:20px; background:linear-gradient(135deg, #a855f7, #3b82f6); color:#fff; padding:12px 20px; border-radius:10px; z-index:10000; box-shadow:0 4px 15px rgba(168,85,247,0.5); font-weight:bold; font-size:14px; animation: fadeInOut 2.5s forwards;";
                                document.body.appendChild(notice);
                                setTimeout(() => notice.remove(), 2500);
                            }).catch(err => console.log('Auto-copy failed', err));
                        }
                    }
                });
            });

            observer.observe(document.body, { childList: true, subtree: true });
        });
    </script>
</body>
</html>
